# Render Blueprint configuration for TripSplit
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: tripsplit
    env: node
    region: singapore
    plan: free
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Render will prompt you for your Neon connection string during setup
